  - amended_at: "2026-09-04T02:15:00Z"
    amended_by: "qa-engineer (fix round, mudanca-negocio-slide-deck, verifier Watchdog+QA re-check)"
    reason: >
      Three fixes to scripts/verify-mudanca-negocio-slide-deck.cjs ordered by
      the verifier's Watchdog + QA passes, not a fresh authoring pass:
      (1) WD-BLOCK-1 (hard-fail): the script was 837 LOC against the repo-wide
      600 hard-fail ceiling. Fixed via genuine seam extraction, not an
      artificial split — pulled the requires/record()-note()/launch-run-report
      -exit driver and the presentation file:// URL builder duplicated
      identically across all three verify-*.cjs scripts into a new
      scripts/lib/verify-shared.cjs, and had all three require it. Also added
      a `withPage` helper for the open-page/navigate/act/close shape every
      check block repeats, and a local `trackPageErrors` helper for a
      pattern duplicated 5x within this file. Net: this file is now 583 LOC
      (down from 837, despite gaining 2 new check functions per fix #3 below);
      scripts/verify-hero-pan.cjs incidentally shrank 211 -> 194 LOC and
      scripts/verify-agentic-first-sdlc.cjs 333 -> 321 LOC as a bonus of the
      same dedup, not a goal in itself. (2) QA-BLOCK-2: the AC1 replaceState
      assertion (`historyLenBefore >= 1`) was vacuous (true in every possible
      browser state). Replaced with an addInitScript-captured
      before/after history.length comparison across the exact navigation
      under test, asserting the delta is exactly 0 (replaceState, not
      pushState). (3) QA-BLOCK-3: added a real assertion for edge case E8
      (history.pushState/replaceState stubbed to throw via addInitScript ->
      in-memory slide/counter navigation keeps working, the URL stays frozen,
      no error is thrown/logged) and for edge case E3 (window resize fired at
      a fixed 100ms delay into the confirmed-300ms transition, settling
      asserted 400ms later) — both deterministic, no unconfirmed-timing race.
      Total assertions: 92/92 passing, 5/5 identical consecutive runs (was
      84/84 at the verifier's last independent count; the prior build-time
      self-report of "90/90" was an estimate, not a measurement — corrected
      here to the actual, tool-counted figure at each point in time).
