payload:
  runtime:
    package_manager: "none"
    node_version: "24.x (via nvm, used only through npx for tooling; no package.json/build step)"
    notes: >
      This is a static, build-free HTML/CSS/JS site by design (see CLAUDE.md).
      No package.json or lockfile is introduced. Verification tools run via
      `npx --yes <pkg>` (self-contained, single-package invocations with no
      external plugin dependencies) so nothing is added to the site's runtime
      or deploy path. Config files (eslint.config.mjs, eslint.static.config.mjs,
      .stylelintrc.json, jsconfig.json, global.d.ts) exist purely for tooling.

  checks:
    - id: lint-html
      category: lint
      command: "npx --yes htmlhint index.html \"presentations/**/*.html\""
      pass_when: "exit_code == 0"
      enforcement: blocking
      scope: whole-repo
      runs_in: [dev-loop, pre-push, gate]
      verified_at: "2026-08-22T22:20:00Z"
      typical_duration_seconds: 1

    - id: lint-js
      category: lint
      command: "npx --yes eslint \"js/**/*.js\" \"presentations/**/*.js\" \"scripts/**/*.cjs\""
      pass_when: "exit_code == 0"
      enforcement: blocking
      scope: whole-repo
      runs_in: [dev-loop, pre-push, gate]
      verified_at: "2026-08-22T23:20:00Z"
      typical_duration_seconds: 1

    - id: lint-css
      category: lint
      command: "npx --yes stylelint \"css/**/*.css\" \"presentations/**/*.css\""
      pass_when: "exit_code == 0"
      enforcement: blocking
      scope: whole-repo
      runs_in: [dev-loop, pre-push, gate]
      verified_at: "2026-08-22T22:20:00Z"
      typical_duration_seconds: 1

    - id: typecheck
      category: typecheck
      command: "npx --yes typescript --project jsconfig.json"
      pass_when: "exit_code == 0"
      enforcement: blocking
      scope: whole-repo
      runs_in: [dev-loop, pre-push, gate]
      verified_at: "2026-08-22T22:24:00Z"
      typical_duration_seconds: 1
      note: >
        `npx tsc` resolves to an unrelated, deprecated npm package named
        "tsc" — do NOT use it. Always invoke via `npx --yes typescript`.
        Uses checkJs/allowJs over global.d.ts (declares the window.Hotsite
        namespace and window.PRESENTATIONS) plus a handful of JSDoc type
        casts at DOM query sites — no runtime behavior changed.

    - id: static-structure
      category: static
      command: "npx --yes eslint --config eslint.static.config.mjs \"js/**/*.js\" \"presentations/**/*.js\" \"scripts/**/*.cjs\""
      pass_when: "exit_code == 0"
      enforcement: blocking
      scope: whole-repo
      runs_in: [dev-loop, pre-push, gate]
      verified_at: "2026-08-22T23:20:00Z"
      typical_duration_seconds: 1
      note: >
        Structural/complexity rules (complexity, max-depth, max-params,
        max-nested-callbacks, no-dupe-else-if, no-duplicate-imports) via
        eslint core only — no SonarQube server available for this repo.

    - id: sast
      category: sast
      command: "semgrep --config auto --error --quiet js/ presentations/ scripts/"
      pass_when: "exit_code == 0"
      enforcement: blocking
      scope: whole-repo
      runs_in: [pre-push, gate]
      verified_at: "2026-08-22T23:20:00Z"
      typical_duration_seconds: 7
      note: >
        Installed via `brew install semgrep` (pip blocked by Homebrew's
        externally-managed-environment guard). Excluded from dev-loop
        because --config auto makes a network call to the semgrep registry.

    - id: e2e-hero-pan
      category: e2e
      command: "NODE_PATH=\"$(npm root -g)\" node scripts/verify-hero-pan.cjs"
      pass_when: "exit_code == 0"
      enforcement: blocking
      scope: "presentations/mudanca-para-negocio/**, presentations/template-driven-ui/**"
      runs_in: [pre-push, gate]
      verified_at: "2026-08-22T23:10:00Z"
      typical_duration_seconds: 5
      note: >
        Validates the hero__photo lateral-pan feature (spec: hero-lateral-
        travelling-photos) end to end in a real Chromium instance: SVG/
        starfield removed, webp <source> present, ping-pong animation
        (hero-pan, 20s, infinite, alternate), prefers-reduced-motion freezes
        the pan with zero JS involved, and image-load failure falls back to
        --color-blue-900 without resurrecting the old SVG. Requires
        `npm install -g playwright && npx --yes playwright install chromium`
        once (same externally-installed-prerequisite pattern as the sast
        check above) — no node_modules or package.json is added to this
        repo; the script is CommonJS specifically so NODE_PATH (which only
        CJS `require` honors, not ESM `import`) can resolve the global
        install. Excluded from dev-loop due to its ~5s Chromium startup cost.

    - id: e2e-agentic-first-sdlc
      category: e2e
      command: "NODE_PATH=\"$(npm root -g)\" node scripts/verify-agentic-first-sdlc.cjs"
      pass_when: "exit_code == 0"
      enforcement: blocking
      scope: "presentations/agentic-first-sdlc/**, js/presentations-data.js"
      runs_in: [pre-push, gate]
      verified_at: "2026-08-23T00:00:00Z"
      typical_duration_seconds: 6
      note: >
        Closes the QA-coverage gap for the agentic-first-sdlc presentation,
        which the e2e-hero-pan check does not cover (that one is scoped to
        mudanca-para-negocio and template-driven-ui only). 28 assertions over
        a real Chromium instance: home-listing card wiring, hero picture/webp
        fallback and load, section presence and DOM order, removed sections
        staying removed, scroll-reveal actually firing, prefers-reduced-motion
        freezing the pan, image-load failure fallback, no horizontal overflow
        at 375px, and the editorial invariants agreed in review (zero em-dash,
        no exact numeric claims, only Uncle Bob and Matt Pocock named).
        Verified 5/5 deterministic. Same externally-installed-prerequisite
        pattern as e2e-hero-pan: requires a one-time
        `npm install -g playwright && npx --yes playwright install chromium`.
        CAVEAT: asserts against the v0 RAW spec, not a sealed one — the
        spec-judge run stopped at iteration 1 (avg 0.41 / max 0.70, above the
        seal thresholds), so these encode requirements as agreed with the PO
        in review and must be revisited if the spec is later sealed.

    - id: e2e-mudanca-negocio-slide-deck
      category: e2e
      command: "NODE_PATH=\"$(npm root -g)\" node scripts/verify-mudanca-negocio-slide-deck.cjs"
      pass_when: "exit_code == 0"
      enforcement: blocking
      scope: "presentations/mudanca-para-negocio/**"
      runs_in: [pre-push, gate]
      verified_at: "2026-09-04T02:15:00Z"
      typical_duration_seconds: 13
      note: >
        Validates the mudanca-negocio-slide-deck sealed spec (content_hash
        sha256:c336f75bacd0cc82d962b93ebb8ae359325d64663467352111858a89aaeceafa)
        end to end in a real Chromium instance, written from the sealed spec's
        acceptance_criteria/edge_cases in parallel with frontend-dev building
        the same feature on this branch (no ComponentManifest existed to pin
        selectors to, so the script documents and proposes its own — see the
        file header). Covers: ?slide= fallback/normalization for missing,
        empty, non-numeric, zero, and out-of-range values, including a
        precise (non-vacuous) check that normalization is a `history.length`
        -neutral replaceState, not a pushState; deep-link opening directly on
        the target slide with no visible flash through earlier slides;
        keyboard/button/dot navigation each moving exactly one slide and
        updating the counter + ?slide= via pushState (a new history entry per
        transition, verified against browser Back stepping one slide at a
        time); boundary no-ops at slide 1 and slide 5; prefers-reduced-motion
        collapsing the transition to an instant cut; no page-level vertical
        scroll or horizontal overflow at a mobile and a desktop viewport;
        non-active slides hidden via CSS essentially immediately (progressive
        enhancement, no flash of all sections) with a companion JS-disabled
        context asserting the full-scroll fallback; video auto-pause on
        navigating away from the video slide; unchanged tap-to-flip on the
        cards slide without triggering navigation; rapid repeated-input
        desync/overshoot protection; swipe explicitly NOT navigating (pulled
        out of scope per the seal); Tab/Enter reachability plus an
        aria-label/aria-live check for the counter; window resize fired at a
        fixed point inside the confirmed 300ms transition window, asserting
        the deck settles cleanly (edge case E3); and history.pushState/
        replaceState stubbed to throw in a restrictive/sandboxed context,
        asserting in-memory navigation keeps working, the URL stays frozen,
        and nothing is thrown/logged (edge case E8). All assertions run
        against file:// URLs throughout (same as this repo's other e2e
        checks), which doubles as the file:// compatibility check the spec
        calls for. 92/92 assertions passing, verified 5/5 identical
        consecutive runs (harness + implementation both deterministic).
        Requires + record()/note() + the launch-run-report-exit driver now
        live in scripts/lib/verify-shared.cjs, shared with e2e-hero-pan and
        e2e-agentic-first-sdlc (extracted to bring this script from 837 LOC
        under the repo's 600-LOC Watchdog hard-fail; now 583 LOC). Requires
        the same one-time `npm install -g playwright && npx --yes playwright
        install chromium` as e2e-hero-pan / e2e-agentic-first-sdlc.

  waivers: []
