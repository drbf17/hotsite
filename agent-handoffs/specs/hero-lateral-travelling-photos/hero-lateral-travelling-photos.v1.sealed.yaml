# Problem Statement

As duas presentations `mudanca-para-negocio` e `template-driven-ui` usam hoje uma cena hero 100% desenhada em SVG (foguetes/estação acoplando) com um starfield de estrelas geradas via JS e parallax por mouse. O pedido é elevar a qualidade visual do hero substituindo essa cena por uma foto de referência já produzida para cada presentation (`resources/mudanca-negocio.jpeg` e `resources/template-driven-ui.jpeg`), com um efeito de câmera "travelling lateral" — um pan horizontal em vai-e-volta (ping-pong) contínuo e automático, implementado inteiramente em CSS — no lugar do parallax reativo ao mouse.

Sucesso é: ao abrir qualquer uma das duas presentations, o hero mostra a foto correspondente cobrindo toda a área, deslizando lateralmente em ping-pong suave, com o texto do hero permanecendo legível (scrim mantido), sem barras vazias em nenhum breakpoint (incluindo ultrawide), caindo para um enquadramento estático quando `prefers-reduced-motion` está ativo, e caindo para um fundo azul sólido se a imagem falhar ao carregar — tudo isso dentro de um orçamento de LCP de 2.5s.

# Notes

- Decisões confirmadas pelo PO nesta rodada de grilling (iteração 2):
  1. Pan duration: 20s por trecho / 40s ida+volta.
  2. Peso de imagem: ≤400KB por arquivo.
  3. Mecanismo do pan: ping-pong (não loop com wraparound sem costura — isso elimina a necessidade de duplicar/tilear a imagem).
  4. Fallback de erro de carregamento: fundo sólido `--color-blue-900`.
  5. LCP ≤2.5s + conversão para WebP/AVIF no escopo.
  6. Ultra-wide: `object-fit: cover`.
  7. Sem Prototyping Agent — as duas fotos em `resources/` já são a referência de design final.
- Simplificação arquitetural aprovada diretamente pelo Tech Lead Agent (interna, sem impacto em AC): tanto o ping-pong quanto o fallback de `prefers-reduced-motion` podem ser expressos em CSS puro (`animation` + `@media (prefers-reduced-motion: reduce)`), então a nova implementação do hero **não depende de JavaScript**. Isso substitui o uso de `Hotsite.utils.prefersReducedMotion()` para este componente especificamente (outros usos do util em cada bundle continuam intactos). `js/hero-scene.js` deve ser removido ou esvaziado nas duas presentations, já que sua lógica de estrelas/parallax por mouse deixa de existir.
- Como o repositório não tem passo de build (ver CLAUDE.md — sem bundler, sem `package.json`), a conversão para WebP/AVIF é uma tarefa de autoria feita uma vez (ex.: `sips`/`cwebp` localmente) que produz arquivos estáticos comitados em `presentations/<slug>/assets/`, servidos via `<picture>` com fontes AVIF/WebP e fallback `<img>` JPEG — não uma pipeline automática.
- `template-driven-ui/` hoje não tem pasta `assets/`; precisará ser criada. `mudanca-para-negocio/assets/` já existe (contém `vdo/` de outra seção) e receberá a nova imagem ao lado.
- `hero.css` de cada bundle já reserva `min-height: 100vh` para `.hero` e tem breakpoints em 640px (ver `tokens.css`); a implementação deve seguir esse mesmo arquivo em vez de criar um CSS novo, por ser uma alteração da seção hero existente.
- Imagens de origem: `resources/mudanca-negocio.jpeg` (estação espacial com foguetes rotulados Pix/Pagamentos/Crédito/Seguros/Assistente Virtual/Extrato) e `resources/template-driven-ui.jpeg` (linha de montagem industrial de nave modular). Ambas 1408×768.
- Sem PII, sem dependência de rede em runtime além dos assets já bundlados no próprio pacote da presentation.

